networks:
  monorepo-net:
    driver: bridge

services:
  job-applier-db:
    image: postgres:17
    container_name: job-applier-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobapplier}
      POSTGRES_USER: ${POSTGRES_USER:-jobapplier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobapplier}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobapplier} -d ${POSTGRES_DB:-jobapplier}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - job-applier-dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    networks:
      - monorepo-net

  ingestion-service:
    container_name: job-applier-ingestion
    build:
      context: .
      dockerfile: apps/ingestion-service/Dockerfile
    image: job-applier-ingestion:dev
    env_file:
      - path: ./apps/ingestion-service/.env
        required: false
    environment:
      DB_URL: jdbc:postgresql://job-applier-db:5432/${POSTGRES_DB:-jobapplier}
      DB_USERNAME: ${POSTGRES_USER:-jobapplier}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobapplier}
      INGESTION_CRON: ${INGESTION_CRON:-0 0 */6 * * *}
      INGESTION_REMOTIVE_CATEGORY: ${INGESTION_REMOTIVE_CATEGORY-software-dev}
      INGESTION_REMOTIVE_SEARCH: ${INGESTION_REMOTIVE_SEARCH-}
      INGESTION_RECIPES_DIR: ${INGESTION_RECIPES_DIR:-/app/recipes}
      INGESTION_RECIPES_AUTO_DIR: /app/recipes-auto
      INGESTION_FETCH_MAX_RUN_DURATION: ${INGESTION_FETCH_MAX_RUN_DURATION:-20m}
      # Recipe learner: off by default. It reaches scoring by name; ingestion does not depend_on scoring (scoring
      # already depends on ingestion, and the learner only needs scoring when a run is started).
      INGESTION_LEARNER_ENABLED: ${INGESTION_LEARNER_ENABLED:-false}
      INGESTION_LEARNER_ALLOWED_HOSTS: ${INGESTION_LEARNER_ALLOWED_HOSTS-}
      INGESTION_LEARNER_SCORING_BASE_URL: ${INGESTION_LEARNER_SCORING_BASE_URL:-http://scoring-service:8082}
      INGESTION_LEARNER_OUTPUT_DIR: /app/recipes-proposed
      INGESTION_LEARNER_MAX_CLONES: ${INGESTION_LEARNER_MAX_CLONES:-80}
      INGESTION_LEARNER_CLONE_MAX_RUN: ${INGESTION_LEARNER_CLONE_MAX_RUN:-30m}
      # Auto-enable of cloned country recipes: off by default; reads only locationCountries from the profile.
      INGESTION_LEARNER_AUTO_ENABLE: ${INGESTION_LEARNER_AUTO_ENABLE:-false}
      INGESTION_LEARNER_MAX_AUTO_ENABLED: ${INGESTION_LEARNER_MAX_AUTO_ENABLED:-20}
      INGESTION_LEARNER_AUTO_ENABLE_BLOCKED: ${INGESTION_LEARNER_AUTO_ENABLE_BLOCKED-}
      INGESTION_LEARNER_PROFILE_FILE: /app/config/profile.yml
    volumes:
      - ./recipes:/app/recipes:ro
      # Recipes enabled by a clone run for the profile's countries: writable for ingestion only. Always loaded;
      # delete a file to disable that country.
      - ./recipes-auto:/app/recipes-auto
      # Only the locationCountries field is read from it, and only when auto-enable is on.
      - ./config:/app/config:ro
      # Review folder for proposed recipes: writable for ingestion only. Nothing here is ever loaded.
      - ./recipes-proposed:/app/recipes-proposed
      # Same shared secret as scoring's (secrets/learner/token); sent as X-Learner-Token.
      - ./secrets/learner/token:/run/secrets/learner_token:ro
    depends_on:
      job-applier-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INGESTION_HTTP_PORT:-8081}:8081"
    restart: unless-stopped
    networks:
      - monorepo-net

  scoring-service:
    container_name: job-applier-scoring
    build:
      context: .
      dockerfile: apps/scoring-service/Dockerfile
    image: job-applier-scoring:dev
    env_file:
      - path: ./apps/scoring-service/.env
        required: false
    environment:
      DB_URL: jdbc:postgresql://job-applier-db:5432/${POSTGRES_DB:-jobapplier}
      DB_USERNAME: ${POSTGRES_USER:-jobapplier}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobapplier}
      SCORING_INGESTION_BASE_URL: http://ingestion-service:8081
      SCORING_PROFILE_PATH: /app/config/profile.yml
      # The digest service calls scoring by this name, so the host guard must accept it.
      SCORING_API_ALLOWED_HOSTS: localhost,127.0.0.1,scoring-service
    volumes:
      - ./config:/app/config:ro
      # Shared secret of the recipe-learn endpoint (secrets/learner/token). Without the file the endpoint does not exist.
      - ./secrets/learner/token:/run/secrets/learner_token:ro
    depends_on:
      job-applier-db:
        condition: service_healthy
      ingestion-service:
        condition: service_started
    ports:
      - "127.0.0.1:${SCORING_HTTP_PORT:-8082}:8082"
    restart: unless-stopped
    networks:
      - monorepo-net

  digest-service:
    container_name: job-applier-digest
    build:
      context: .
      dockerfile: apps/digest-service/Dockerfile
    image: job-applier-digest:dev
    env_file:
      - path: ./apps/digest-service/.env
        required: false
    environment:
      DB_URL: jdbc:postgresql://job-applier-db:5432/${POSTGRES_DB:-jobapplier}
      DB_USERNAME: ${POSTGRES_USER:-jobapplier}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobapplier}
      DIGEST_SCORING_BASE_URL: http://scoring-service:8082
      DIGEST_OUT_DIR: /app/digest-out
    volumes:
      - ./digest-out:/app/digest-out
      # Only the digest's own secret files (secrets/digest/smtp_password). Docker creates the folder if it is missing.
      - ./secrets/digest:/run/secrets:ro
    depends_on:
      job-applier-db:
        condition: service_healthy
      scoring-service:
        condition: service_started
    ports:
      - "127.0.0.1:${DIGEST_HTTP_PORT:-8083}:8083"
    restart: unless-stopped
    networks:
      - monorepo-net

  web-ui:
    container_name: job-applier-ui
    build:
      context: .
      dockerfile: apps/web-ui/Dockerfile
    image: job-applier-ui:dev
    env_file:
      - path: ./apps/web-ui/.env
        required: false
    environment:
      UI_SCORING_BASE_URL: http://scoring-service:8082
    depends_on:
      scoring-service:
        condition: service_started
    ports:
      # Loopback only: the page has a button that spends money and no login.
      - "127.0.0.1:${UI_HTTP_PORT:-8084}:8084"
    restart: unless-stopped
    networks:
      - monorepo-net

volumes:
  job-applier-dbdata:
