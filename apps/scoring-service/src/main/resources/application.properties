spring.application.name=scoring-service
spring.main.web-application-type=servlet
server.port=8082

# Scoring is off by default: no provider, no profile and no keys are needed to start.
scoring.enabled=${SCORING_ENABLED:false}
scoring.profile-path=${SCORING_PROFILE_PATH:./profile.yml}
scoring.max-attempts=3
scoring.llm.model=${SCORING_LLM_MODEL:}
scoring.llm.free=${SCORING_LLM_FREE:false}
scoring.llm.max-tokens=600
scoring.llm.max-description-chars=6000
# Output cap per call. For the openai provider it is sent as max-completion-tokens (not max-tokens);
# anthropic and ollama get max-tokens. The worst-case budget reservation uses the same number.
# Temperature is left out of the request unless set (some models reject it): scoring.llm.temperature=0.2
# Prices, USD per million tokens, keyed by model name. A name with a dot needs brackets:
#   scoring.llm.prices[gpt-4.1-mini].input-per-million=0.40
#   scoring.llm.prices[gpt-4.1-mini].output-per-million=1.60
# scoring.llm.free=true is only for a local provider (ollama); it is refused for openai and anthropic.
scoring.budget.daily-usd=${SCORING_BUDGET_DAILY_USD:1.00}
scoring.budget.zone=${SCORING_BUDGET_ZONE:system}

# One provider at most: openai, anthropic or ollama. Everything else stays off.
spring.ai.model.chat=${SCORING_AI_PROVIDER:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# No hidden retries: every attempt is a billed call and is counted by the service itself.
spring.ai.retry.max-attempts=1
spring.ai.openai.max-retries=0
spring.ai.openai.timeout=60s
spring.ai.anthropic.max-retries=0
spring.ai.anthropic.timeout=60s
# Ollama goes through the Boot-configured HTTP client.
spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=60s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/jobapplier}
spring.datasource.username=${DB_USERNAME:jobapplier}
spring.datasource.password=${DB_PASSWORD:jobapplier}

# Own schema and own Flyway history, next to ingestion's history in public.
spring.flyway.schemas=scoring
spring.flyway.default-schema=scoring
spring.jpa.properties.hibernate.default_schema=scoring
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Pull from ingestion (only with scoring.enabled=true). The overlap re-pulls a little history so a late commit
# on the ingestion side is not missed; duplicates are absorbed by the dedupe. Cron "-" turns the schedule off.
# Ingestion has no paging: one pull returns everything since the cursor, capped by max-bytes.
scoring.ingestion.base-url=${SCORING_INGESTION_BASE_URL:http://localhost:8081}
scoring.ingestion.overlap=5m
scoring.ingestion.chunk-size=50
scoring.ingestion.cron=${SCORING_INGESTION_CRON:0 15 */6 * * *}
scoring.ingestion.connect-timeout=5s
scoring.ingestion.read-timeout=60s
scoring.ingestion.max-bytes=67108864

# Host names the API answers to (DNS-rebinding guard). Compose adds scoring-service for the digest service.
scoring.api.allowed-hosts=${SCORING_API_ALLOWED_HOSTS:localhost,127.0.0.1}
