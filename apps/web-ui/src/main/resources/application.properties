spring.application.name=web-ui
spring.main.web-application-type=servlet
server.port=8084

# Off by default: no UI beans, no pages.
ui.enabled=${UI_ENABLED:false}
# Host names the UI answers to (bare names). Anything else gets 403.
ui.allowed-hosts=${UI_ALLOWED_HOSTS:localhost,127.0.0.1}
# Minimum time between two accepted run requests.
ui.run-cooldown=60s

ui.scoring.base-url=${UI_SCORING_BASE_URL:http://localhost:8082}
ui.scoring.connect-timeout=5s
ui.scoring.read-timeout=10s
ui.scoring.max-bytes=8388608

# No error details on any page; the app writes its own fixed error pages.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
spring.thymeleaf.cache=true

management.endpoints.web.exposure.include=health
