spring.application.name=ingestion-service
server.port=8081

# 4 fetches a day: Remotive asks for at most about that and blocks above 2 per minute.
ingestion.cron=0 0 */6 * * *
ingestion.remotive.url=https://remotive.com/api/remote-jobs
ingestion.remotive.timeout=15s
ingestion.remotive.category=${INGESTION_REMOTIVE_CATEGORY:software-dev}
ingestion.remotive.search=${INGESTION_REMOTIVE_SEARCH:}

# Polite fetcher. allow-insecure-hosts must stay empty here; only tests set it.
ingestion.fetch.user-agent=JobApplierBot/0.1 (personal job-search tool)
ingestion.fetch.min-delay=2s
ingestion.fetch.connect-timeout=10s
ingestion.fetch.total-timeout=30s
ingestion.fetch.max-body-bytes=5242880
ingestion.fetch.allow-insecure-hosts=
# Sitemap requests only: compressed download cap (the unpacked cap is fixed at 50 MB).
ingestion.fetch.max-sitemap-bytes=20971520
# A recipe crawl stops after this long and keeps what it collected.
ingestion.fetch.max-run-duration=${INGESTION_FETCH_MAX_RUN_DURATION:20m}

# Declarative site recipes (JSON files); a missing directory just means none.
ingestion.recipes.dir=${INGESTION_RECIPES_DIR:./recipes}
# Recipes the clone run enabled for the profile's countries (writable; always loaded, also when auto-enable is off).
ingestion.recipes.auto-dir=${INGESTION_RECIPES_AUTO_DIR:./recipes-auto}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/jobapplier}
spring.datasource.username=${DB_USERNAME:jobapplier}
spring.datasource.password=${DB_PASSWORD:jobapplier}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Recipe learner (off by default; no learner bean exists unless enabled). A host is fetched only if it is listed here,
# which is how you record that you reviewed its terms of use and robots.txt.
ingestion.learner.enabled=${INGESTION_LEARNER_ENABLED:false}
ingestion.learner.allowed-hosts=${INGESTION_LEARNER_ALLOWED_HOSTS:}
ingestion.learner.scoring-base-url=${INGESTION_LEARNER_SCORING_BASE_URL:http://localhost:8082}
ingestion.learner.token-file=${INGESTION_LEARNER_TOKEN_FILE:/run/secrets/learner_token}
ingestion.learner.output-dir=${INGESTION_LEARNER_OUTPUT_DIR:./recipes-proposed}
ingestion.learner.max-input-chars=12000

# Auto-enable of cloned country recipes (off by default, separate from the learner switch). Reads only the
# locationCountries field of the profile file. Enabled recipes become active after an ingestion restart.
ingestion.learner.auto-enable=${INGESTION_LEARNER_AUTO_ENABLE:false}
ingestion.learner.max-auto-enabled=${INGESTION_LEARNER_MAX_AUTO_ENABLED:20}
ingestion.learner.auto-enable-blocked=${INGESTION_LEARNER_AUTO_ENABLE_BLOCKED:}
ingestion.learner.profile-file=${INGESTION_LEARNER_PROFILE_FILE:./config/profile.yml}
