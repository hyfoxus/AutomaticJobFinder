spring.application.name=digest-service
spring.main.web-application-type=servlet
server.port=8083

# Optional secret files (Docker secrets): a file named smtp_password becomes the property smtp_password.
spring.config.import=optional:configtree:/run/secrets/

# Off by default: no digest beans, nothing is read or sent.
digest.enabled=${DIGEST_ENABLED:false}
# dry-run (default) writes the digest to out-dir and records nothing; smtp sends it.
digest.mode=${DIGEST_MODE:dry-run}
digest.out-dir=${DIGEST_OUT_DIR:./digest-out}
digest.tiers=${DIGEST_TIERS:STRONG,PARTIAL}
digest.max-items=${DIGEST_MAX_ITEMS:50}
# The scan restarts this far before its end, so a late commit on the scoring side is not missed. Must be positive.
digest.overlap=5m
# First run in smtp mode looks this far back.
digest.initial-lookback=7d
# Spring cron, container time zone; "-" turns the schedule off.
digest.cron=${DIGEST_CRON:0 0 8 * * *}

digest.scoring.base-url=${DIGEST_SCORING_BASE_URL:http://localhost:8082}
digest.scoring.connect-timeout=5s
digest.scoring.read-timeout=30s
digest.scoring.max-bytes=8388608

digest.smtp.host=${DIGEST_SMTP_HOST:}
digest.smtp.port=${DIGEST_SMTP_PORT:587}
digest.smtp.username=${DIGEST_SMTP_USERNAME:}
digest.smtp.from=${DIGEST_SMTP_FROM:}
digest.smtp.to=${DIGEST_SMTP_TO:}
digest.smtp.ssl=${DIGEST_SMTP_SSL:false}
digest.smtp.allow-plaintext=${DIGEST_SMTP_ALLOW_PLAINTEXT:false}
# The password is read from the environment or the secret file, never bound into a settings record.
digest.smtp.password=${DIGEST_SMTP_PASSWORD:${smtp_password:}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/jobapplier}
spring.datasource.username=${DB_USERNAME:jobapplier}
spring.datasource.password=${DB_PASSWORD:jobapplier}

# Own schema and own Flyway history.
spring.flyway.schemas=digest
spring.flyway.default-schema=digest
spring.jpa.properties.hibernate.default_schema=digest
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
