// Aggregator: no code lives at the root. Each module owns its build.
allprojects {
    group = 'com.gnemirko'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}
