services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    environment:
      - 'DB_URL=jdbc:postgresql://postgres:5432/mydatabase'
      - 'DB_USER=myuser'
      - 'DB_PASSWORD=secret'
    ports:
      - '8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
